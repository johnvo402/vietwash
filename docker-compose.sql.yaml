version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
    volumes:
      - db_data:/var/opt/mssql


  redis:
    image: redis:latest
    container_name: redis
    volumes:
      - rd_data:/data
    restart: always

  gateway:
    environment:
      - ConnectionStrings__REDIS_SERVER=redis:6379
      
  auth-service:
    depends_on:
      - "sqlserver"
    environment:
      - ConnectionStrings__DefaultConnection=${AUTHDB_CONNECTION}
      - ConnectionStrings__REDIS_SERVER=redis:6379

  product-service:
    depends_on:
      - "sqlserver"
    environment:
      - ConnectionStrings__DefaultConnection=${PRODUCTDB_CONNECTION}
      - ConnectionStrings__REDIS_SERVER=redis:6379
volumes:
  db_data:
  rd_data: