services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
    volumes:
      - db_data:/var/opt/mssql

  rabbitmq:
    image: "rabbitmq:management"
    container_name: rabbitmq
    ports:
      - "5672:5672" # RabbitMQ protocol port
      - "15672:15672" # RabbitMQ management console (web UI)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:latest
    container_name: redis
    volumes:
      - rd_data:/data
    restart: always

  gateway:
    environment:
      - ConnectionStrings__REDIS_SERVER=redis:6379

  auth-service:
    depends_on:
      - "sqlserver"
    environment:
      - ConnectionStrings__DefaultConnection=${AUTHDB_CONNECTION}
      - ConnectionStrings__REDIS_SERVER=redis:6379

  product-service:
    depends_on:
      - "sqlserver"
    environment:
      - ConnectionStrings__DefaultConnection=${PRODUCTDB_CONNECTION}
      - ConnectionStrings__REDIS_SERVER=redis:6379
volumes:
  db_data:
  rd_data:
  rabbitmq_data:
