worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # SignalR and signed media use query credentials; never log query strings.
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log warn;
    server_tokens off;
    # Docker's embedded DNS keeps upstreams current after compose replaces a container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 200M;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:3000 resolve;
    }

    upstream backend {
        zone backend 64k;
        least_conn;
        server gateway:8080 resolve max_fails=3 fail_timeout=10s;
        server gateway-2:8080 resolve max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;

        # Route APIs, not Next.js pages such as /auth/login.
        location ~* ^/(Auth|Ecommerce|Project|Finance|Notification)/api(/|$) {
            proxy_pass http://backend;
        }

        # Existing SignalR and public media routes; no MinIO console route.
        location ~* ^/(notification/hub|image)(/|$) {
            proxy_pass http://backend;
        }

        # Health check endpoint
        location = /health {
            proxy_pass http://backend;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}
