name: Frontend CI

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java for OpenAPI Generator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency graph
        run: npm audit --audit-level=low

      - name: Generate API client
        run: npm run generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:test
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_MEDIA_URL: ${{ vars.STAGING_MEDIA_URL }}
          NEXT_PUBLIC_CLIENT_ID: admin-laundry
          NEXT_PUBLIC_PLATFORM: admin-web

  publish-image:
    needs: build-and-check
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve immutable tag
        id: version
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/johnvo402/vietwash-frontend:sha-${{ steps.version.outputs.short_sha }}
          build-args: |
            NEXT_PUBLIC_MEDIA_URL=${{ vars.STAGING_MEDIA_URL }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Promote checked image to dev
        shell: bash
        env:
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/johnvo402/vietwash-frontend:dev \
            "ghcr.io/johnvo402/vietwash-frontend:sha-${SHORT_SHA}"
