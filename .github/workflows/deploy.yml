name: Auto Deploy Service to VPS

on:
  push:
    branches:
      - dev
    paths:
      - "src/ApiGateway/**"
      - "src/AuthService/**"
      - "src/EcommeceService/**"
      - "src/FinanceService/**"
      - "src/ProjectService/**"
      - "src/NotificationService/**"
      - "src/Contracts/**"
      - "src/Shared.Kernel/**"
      - "Directory.Packages.props"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Lấy full history để diff

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Detect changed services
        id: detect
        run: |
          echo "Detecting changed services..."

          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})

          echo "Changed files:"
          echo "$CHANGED_FILES"

          SERVICES=()

          for DIR in src/ApiGateway src/AuthService src/EcommeceService src/FinanceService src/ProjectService src/NotificationService; do
            if echo "$CHANGED_FILES" | grep -q "^${DIR}/"; then
              case $DIR in
                src/ApiGateway)
                  SERVICES+=("gateway")
                  ;;
                src/AuthService)
                  SERVICES+=("auth")
                  ;;
                src/EcommeceService)
                  SERVICES+=("ecommerce")
                  ;;
                src/FinanceService)
                  SERVICES+=("finance")
                  ;;
                src/ProjectService)
                  SERVICES+=("project")
                  ;;
                src/NotificationService)
                  SERVICES+=("notification")
                  ;;
              esac
            fi
          done

          # Shared code and central dependency changes affect every service.
          if echo "$CHANGED_FILES" | grep -Eq "^(src/Contracts/|src/Shared\.Kernel/|Directory\.Packages\.props$)"; then
            SERVICES=(gateway auth ecommerce finance project notification)
          fi

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "No relevant services changed. Exiting."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Services to deploy: ${SERVICES[@]}"
          echo "services=${SERVICES[@]}" >> $GITHUB_OUTPUT

      - name: Skip if no service changed
        if: steps.detect.outputs.skip == 'true'
        run: echo "No services need deployment."

      - name: Make deploy script executable
        if: steps.detect.outputs.skip != 'true'
        run: chmod +x ./scripts/deploy.sh
      - name: Add VPS to known hosts
        if: steps.detect.outputs.skip != 'true'
        env:
          REMOTE_SERVER_IP: ${{ secrets.REMOTE_SERVER_IP }}
          REMOTE_SERVER_PORT: ${{ secrets.REMOTE_SERVER_PORT }}
        run: |
          set -euo pipefail

          if [[ -z "${REMOTE_SERVER_IP}" || -z "${REMOTE_SERVER_PORT}" ]]; then
            echo "::error::The deployment SSH endpoint is not fully configured."
            exit 1
          fi

          if ! [[ "${REMOTE_SERVER_PORT}" =~ ^[0-9]+$ ]] || (( REMOTE_SERVER_PORT < 1 || REMOTE_SERVER_PORT > 65535 )); then
            echo "::error::The configured deployment SSH port is invalid."
            exit 1
          fi

          host_keys="${RUNNER_TEMP}/deployment_known_hosts"
          if ! timeout 15s ssh-keyscan -T 5 -p "${REMOTE_SERVER_PORT}" "${REMOTE_SERVER_IP}" > "${host_keys}" 2>/dev/null || [[ ! -s "${host_keys}" ]]; then
            echo "::error::Unable to reach the configured deployment SSH endpoint or retrieve its host key."
            exit 1
          fi

          install -m 700 -d "${HOME}/.ssh"
          cat "${host_keys}" >> "${HOME}/.ssh/known_hosts"

      - name: Run deploy script
        if: steps.detect.outputs.skip != 'true'
        env:
          REMOTE_SERVER_USER: ${{ secrets.REMOTE_SERVER_USER }}
          REMOTE_SERVER_IP: ${{ secrets.REMOTE_SERVER_IP }}
          REMOTE_SERVER_PORT: ${{ secrets.REMOTE_SERVER_PORT }}
        run: |
          ./scripts/deploy.sh ${{ steps.detect.outputs.services }}
