name: Publish Backend Images

on:
  push:
    branches:
      - dev
    paths:
      - "src/ApiGateway/**"
      - "src/AuthService/**"
      - "src/EcommeceService/**"
      - "src/ProjectService/**"
      - "src/FinanceService/**"
      - "src/NotificationService/**"
      - "src/Contracts/**"
      - "src/Shared.Kernel/**"
      - "src/Statics/**"
      - "Directory.Packages.props"
      - "NuGet.Config"
      - "scripts/publish.sh"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-backend-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: johnvo402

jobs:
  build-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - service: gateway
            dockerfile: src/ApiGateway/Dockerfile
          - service: auth
            dockerfile: src/AuthService/Dockerfile
          - service: ecommerce
            dockerfile: src/EcommeceService/Dockerfile
          - service: project
            dockerfile: src/ProjectService/Dockerfile
          - service: finance
            dockerfile: src/FinanceService/Dockerfile
          - service: notification
            dockerfile: src/NotificationService/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve immutable image tag
        id: version
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Publish ${{ matrix.service }}
        shell: bash
        run: |
          chmod +x scripts/publish.sh
          ./scripts/publish.sh "${{ matrix.service }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/vietwash-${{ matrix.service }}:sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  promote-dev:
    name: Promote release set to dev
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve immutable image tag
        id: version
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable release set
        shell: bash
        env:
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          set -euo pipefail

          for service in gateway auth ecommerce project finance notification; do
            docker buildx imagetools inspect \
              "${REGISTRY}/${GHCR_OWNER}/vietwash-${service}:sha-${SHORT_SHA}" > /dev/null
          done

      - name: Promote release set to dev
        shell: bash
        env:
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          set -euo pipefail

          for service in gateway auth ecommerce project finance notification; do
            image="${REGISTRY}/${GHCR_OWNER}/vietwash-${service}"
            docker buildx imagetools create \
              --tag "${image}:dev" \
              "${image}:sha-${SHORT_SHA}"
          done
