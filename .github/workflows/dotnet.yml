name: Backend CI

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "tests/**"
      - "Micro.sln"
      - "Directory.Packages.props"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [dev]
    paths:
      - "src/**"
      - "tests/**"
      - "Micro.sln"
      - "Directory.Packages.props"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Micro.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build Micro.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/UnitTest/AuthService.Tests/AuthService.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
