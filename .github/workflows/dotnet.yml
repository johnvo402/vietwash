name: Backend CI

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "tests/**"
      - "Micro.sln"
      - "Directory.Packages.props"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [dev]
    paths:
      - "src/**"
      - "tests/**"
      - "Micro.sln"
      - "Directory.Packages.props"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Micro.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build Micro.sln --configuration Release --no-restore

      - name: Run pure unit tests
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t test_projects < <(find tests/UnitTest -type f -name "*.csproj" | sort)

          if (( ${#test_projects[@]} == 0 )); then
            echo "::error::No pure unit test projects were found under tests/UnitTest."
            exit 1
          fi

          for project in "${test_projects[@]}"; do
            echo "::group::Unit tests: ${project}"
            dotnet test "${project}" --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
            echo "::endgroup::"
          done
