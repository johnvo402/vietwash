name: Backend CI

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "tests/**"
      - "Micro.sln"
      - "Directory.Packages.props"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [dev]
    paths:
      - "src/**"
      - "tests/**"
      - "Micro.sln"
      - "Directory.Packages.props"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: seed_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: vietwash_seed_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seed_test -d vietwash_seed_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      VIETWASH_SEED_TEST_DATABASE: Host=localhost;Port=5432;Database=vietwash_seed_test;Username=seed_test;Password=ci-local-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Micro.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build Micro.sln --configuration Release --no-restore --warnaserror

      - name: Prepare isolated database extensions
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U seed_test -d vietwash_seed_test
          -c 'CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS hstore;'

      - name: Run unit and isolated database regressions
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t test_projects < <(find tests/UnitTest -type f -name "*.csproj" | sort)

          if (( ${#test_projects[@]} == 0 )); then
            echo "::error::No pure unit test projects were found under tests/UnitTest."
            exit 1
          fi

          for project in "${test_projects[@]}"; do
            echo "::group::Unit tests: ${project}"
            dotnet test "${project}" --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
            echo "::endgroup::"
          done
