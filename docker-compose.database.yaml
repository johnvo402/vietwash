services:
  database:
    container_name: database
    image: postgis/postgis:14-3.5
    restart: always
    command:
      - "-cshared_preload_libraries=pg_stat_statements"
      - "-cpg_stat_statements.max=10000"
      - "-cpg_stat_statements.track=all"
      - "-cmax_connections=200"
    volumes:
      - db_data:/var/lib/postgresql/data
      # - ./scripts/bootstrap:/bootstrap:ro
      - ./scripts/docker-entrypoint-initdb.d/000_createdb.sql:/docker-entrypoint-initdb.d/000_createdb.sql
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    shm_size: ${POSTGRES_SHM_SIZE}
    
  redis:
    image: redis:7.4.11-alpine
    container_name: redis-db
    volumes:
      - rd_data:/data  # Persist Redis data using a named volume
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}  # Secure Redis with a password (replace with a strong password)
    command: >
      redis-server --requirepass "${REDIS_PASSWORD}"

  gateway:
    depends_on:
      - "database"
  gateway-2:
    depends_on:
      - "database"

  auth:
    depends_on:
      - "database"
  project:
    depends_on:
      - "database"
  ecommerce:
    depends_on:
      - "database"
  finance:
    depends_on:
      - "database"
  notification:
    depends_on:
      - "database"
      
volumes:
  db_data:
  rd_data:

