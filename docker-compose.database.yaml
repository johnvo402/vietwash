services:
  database:
    image: postgis/postgis:14-3.5
    restart: always
    command:
      - "-cshared_preload_libraries=pg_stat_statements"
      - "-cpg_stat_statements.max=10000"
      - "-cpg_stat_statements.track=all"
      - "-cmax_connections=200"
    volumes:
      - db_data:/var/lib/postgresql/data
      # - ./scripts/bootstrap:/bootstrap:ro
      - ./scripts/docker-entrypoint-initdb.d/000_createdb.sql:/docker-entrypoint-initdb.d/000_createdb.sql
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: ${POSTGRES_SHM_SIZE}
    
  redis:
    image: redis:7.4.11-alpine
    restart: always
    volumes:
      - rd_data:/data  # Persist Redis data using a named volume
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}  # Secure Redis with a password (replace with a strong password)
    command: >
      redis-server --requirepass "${REDIS_PASSWORD}"

  gateway:
    depends_on:
      database:
        condition: service_healthy
  gateway-2:
    depends_on:
      database:
        condition: service_healthy

  auth:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
  project:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
  ecommerce:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
  finance:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
  notification:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      
volumes:
  db_data:
  rd_data:

