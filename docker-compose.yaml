services:
  auth-service:
    container_name: auth-service
    image: auth-service
    ports:
      - "8080"
    environment:
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__TokenExpirationInMinutes=${JWT_TOKEN_EXPIRATION_IN_MINUTES}
    restart: always

  product-service:
    container_name: product-service
    image: product-service
    ports:
      - "8080"
    environment:
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__TokenExpirationInMinutes=${JWT_TOKEN_EXPIRATION_IN_MINUTES}
    restart: always

  gateway:
    container_name: gateway
    image: gateway
    ports:
      - "8080"
    restart: always
volumes:
  db_data:
  rd_data:

  # dotnet ef database update --project src/AuthService/AuthService.Infrastructure --startup-project src/AuthService/AuthService.API
  # dotnet ef database update --project src/ProductService/ProductService.Infrastructure --startup-project src/ProductService/ProductService.API
