version: "3.8"

services:
  auth-service:
    container_name: auth-service
    image: auth-service
    ports:
      - "5001:8080"
    volumes:
      - ./src/AuthService/AuthService.API/keys:/app/AuthService/AuthService.API/keys
    environment:
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    restart: always

  product-service:
    container_name: product-service
    image: product-service
    ports:
      - "5002:8080"
    environment:
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    restart: always

  gateway:
    container_name: gateway
    image: gateway
    ports:
      - "5000:8080"
    restart: always
volumes:
  db_data:
  rd_data:

  # dotnet ef database update --project src/AuthService/AuthService.Infrastructure --startup-project src/AuthService/AuthService.API
  # dotnet ef database update --project src/ProductService/ProductService.Infrastructure --startup-project src/ProductService/ProductService.API
