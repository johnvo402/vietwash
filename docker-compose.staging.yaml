# yaml refs
x-refs:
  common_config: &common_config
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"

services:
  auth:
    <<: *common_config
    image: auth
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
    build:
      context: .
      dockerfile: ./src/AuthService/Dockerfile
      
  gateway:
    <<: *common_config
    image: gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
    build:
      context: .
      dockerfile: ./src/ApiGateway/Dockerfile

  