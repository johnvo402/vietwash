services:
  database:
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdump:/backup:ro
  redis:
    ports:
      - "6379:6379"
  pgadmin:
    image: dpage/pgadmin4:9.17
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_DEFAULT_SERVER: database
    depends_on:
      - database
    volumes:
      - pgadmin_data:/var/lib/pgadmin/

volumes:
  nuget_cache:
  pgadmin_data:
