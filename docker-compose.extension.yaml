services:
  seq:
    image: datalust/seq:2026.1.17114
    container_name: seq
    volumes:
      - ./seq:/data
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_FIRSTRUN_ADMINPASSWORD}
    ports:
      - "127.0.0.1:5341:80"

  collector:
    image: otel/opentelemetry-collector:0.159.0
    container_name: collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "127.0.0.1:4317:4317" # OTLP over gRPC receiver
      - "127.0.0.1:4318:4318" # OTLP over HTTP receiver
      - "127.0.0.1:13133:13133" # health_check extension
    depends_on:
      - jaeger

  jaeger:
    container_name: jaeger
    image: jaegertracing/jaeger:2.20.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:6831:6831/udp" # UDP port for receiving traces
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:14268:14268" # Jaeger collector HTTP port
      - "127.0.0.1:14250:14250" # gRPC for Jaeger

